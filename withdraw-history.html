<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Withdrawal History</title><style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial,sans-serif;
}

body{
  background:#f4f7f5;
  color:#222;
}

.header{
  position:relative;
  background:#0b8f55;
  color:white;
  padding:18px 16px;
  text-align:center;
  font-size:21px;
  font-weight:bold;
  box-shadow:0 2px 8px rgba(0,0,0,.12);
}

.back-btn{
  position:absolute;
  left:14px;
  top:12px;
  background:rgba(255,255,255,.15);
  color:white;
  border:1px solid rgba(255,255,255,.35);
  border-radius:8px;
  padding:8px 12px;
  font-size:14px;
  font-weight:bold;
  cursor:pointer;
}

.back-btn:active{
  transform:scale(.96);
}

.container{
  max-width:650px;
  margin:auto;
  padding:16px 12px 30px;
}

.summary{
  background:white;
  border-radius:14px;
  padding:17px;
  margin-bottom:15px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.summary-title{
  color:#666;
  font-size:13px;
  margin-bottom:7px;
}

.summary-amount{
  color:#0b8f55;
  font-size:25px;
  font-weight:bold;
}

.summary-count{
  color:#777;
  font-size:13px;
  margin-top:6px;
}

.empty{
  background:white;
  border-radius:14px;
  padding:40px 20px;
  text-align:center;
  color:#777;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.empty-icon{
  font-size:42px;
  margin-bottom:12px;
}

.empty h3{
  color:#444;
  margin-bottom:7px;
}

.record{
  background:white;
  border-radius:14px;
  padding:16px;
  margin-bottom:13px;
  box-shadow:0 3px 12px rgba(0,0,0,.07);
}

.record-top{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
  margin-bottom:13px;
}

.amount{
  font-size:21px;
  font-weight:bold;
  color:#222;
}

.status{
  padding:6px 10px;
  border-radius:20px;
  font-size:12px;
  font-weight:bold;
}

.status.pending{
  background:#fff4d9;
  color:#956500;
}

.status.inprocess{
  background:#e7f1ff;
  color:#1261a0;
}

.status.approved{
  background:#e6f8ee;
  color:#087f4d;
}

.status.rejected{
  background:#ffe8e8;
  color:#b42318;
}

.details{
  border-top:1px solid #eee;
  padding-top:11px;
}

.row{
  display:flex;
  justify-content:space-between;
  gap:12px;
  padding:6px 0;
  font-size:13px;
}

.row .label{
  color:#777;
}

.row .value{
  color:#333;
  text-align:right;
  font-weight:600;
  word-break:break-word;
}

.request-id{
  margin-top:10px;
  padding:9px;
  background:#f6f7f7;
  border-radius:8px;
  font-size:11px;
  color:#777;
  word-break:break-all;
}

.refund{
  margin-top:10px;
  padding:9px;
  border-radius:8px;
  background:#e8f8ef;
  color:#087f4d;
  font-size:12px;
  font-weight:bold;
}

.refresh-btn{
  width:100%;
  height:45px;
  border:0;
  border-radius:10px;
  background:#0b8f55;
  color:white;
  font-size:14px;
  font-weight:bold;
  margin-bottom:15px;
  cursor:pointer;
}

.refresh-btn:active{
  transform:scale(.98);
}

.loading{
  background:white;
  border-radius:14px;
  padding:35px 20px;
  text-align:center;
  color:#777;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}

.error{
  background:#ffe8e8;
  color:#b42318;
  border-radius:14px;
  padding:20px;
  text-align:center;
  box-shadow:0 3px 12px rgba(0,0,0,.06);
}
</style></head><body><div class="header"><button
class="back-btn"
onclick="goBack()"

«»

← Back

  </button>Withdrawal History

</div><div class="container"><button
class="refresh-btn"
onclick="loadHistory()"

«»

↻ Refresh History

  </button>  <div class="summary"><div class="summary-title">
  Total Withdrawal Requested
</div>

<div
  class="summary-amount"
  id="totalAmount"
>
  PKR 0.00
</div>

<div
  class="summary-count"
  id="totalCount"
>
  0 withdrawals
</div>

  </div>  <div id="historyContainer">
    <div class="loading">
      Loading withdrawal history...
    </div>
  </div></div><script>

const API_URL =
  "https://aasan-rozgaar-backend.onrender.com";


function getCurrentUser(){

  return (
    localStorage.getItem(
      "currentUser"
    ) || ""
  ).trim();

}


function getUserSessionToken(){

  return (
    sessionStorage.getItem(
      "userSessionToken"
    ) ||
    sessionStorage.getItem(
      "sessionToken"
    ) ||
    ""
  );

}


function getUserCsrfToken(){

  return (
    sessionStorage.getItem(
      "userCsrfToken"
    ) ||
    sessionStorage.getItem(
      "csrfToken"
    ) ||
    ""
  );

}


function userHeaders(){

  const token =
    getUserSessionToken();

  const csrfToken =
    getUserCsrfToken();

  const headers = {
    "Accept":"application/json"
  };

  if(token){

    headers["Authorization"] =
      "Bearer " + token;

  }

  if(csrfToken){

    headers["X-CSRF-Token"] =
      csrfToken;

  }

  return headers;

}


function goBack(){

  if(
    document.referrer &&
    document.referrer !==
    window.location.href
  ){

    history.back();

  }else{

    window.location.href =
      "./home.html";

  }

}


function escapeHTML(value){

  return String(value ?? "")
    .replace(/&/g,"&amp;")
    .replace(/</g,"&lt;")
    .replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;")
    .replace(/'/g,"&#039;");

}


function formatDate(value){

  if(
    value === undefined ||
    value === null ||
    value === ""
  ){

    return "—";

  }

  const date =
    new Date(value);

  if(
    Number.isNaN(
      date.getTime()
    )
  ){

    return String(value);

  }

  return date.toLocaleString(
    "en-PK",
    {
      day:"2-digit",
      month:"2-digit",
      year:"numeric",
      hour:"2-digit",
      minute:"2-digit",
      second:"2-digit"
    }
  );

}


function getStatusClass(status){

  const s =
    String(status || "")
      .toLowerCase()
      .replace(/[\s_-]/g,"");

  if(s === "approved"){
    return "approved";
  }

  if(
    s === "inprocess" ||
    s === "processing"
  ){

    return "inprocess";

  }

  if(
    s === "rejected" ||
    s === "reject"
  ){

    return "rejected";

  }

  return "pending";

}


function getStatusText(status){

  const s =
    String(status || "")
      .toLowerCase()
      .replace(/[\s_-]/g,"");

  if(s === "approved"){
    return "Approved";
  }

  if(
    s === "inprocess" ||
    s === "processing"
  ){

    return "Inprocess";

  }

  if(
    s === "rejected" ||
    s === "reject"
  ){

    return "Rejected";

  }

  return "Pending";

}


async function loadHistory(){

  const username =
    getCurrentUser();

  const container =
    document.getElementById(
      "historyContainer"
    );

  const totalAmount =
    document.getElementById(
      "totalAmount"
    );

  const totalCount =
    document.getElementById(
      "totalCount"
    );


  if(!username){

    container.innerHTML = `
      <div class="empty">

        <div class="empty-icon">
          🔐
        </div>

        <h3>Login Required</h3>

        <p>
          Please login to view your withdrawal history.
        </p>

      </div>
    `;

    totalAmount.textContent =
      "PKR 0.00";

    totalCount.textContent =
      "0 withdrawals";

    return;

  }


  container.innerHTML = `
    <div class="loading">
      Loading withdrawal history...
    </div>
  `;


  const token =
    getUserSessionToken();

  const csrfToken =
    getUserCsrfToken();


  if(!token){

    container.innerHTML = `
      <div class="error">
        Session expired. Please login again.
      </div>
    `;

    totalAmount.textContent =
      "PKR 0.00";

    totalCount.textContent =
      "0 withdrawals";

    return;

  }


  try{

    const response =
      await fetch(
        API_URL +
        "/api/withdrawals/" +
        encodeURIComponent(username),
        {
          method:"GET",
          headers:userHeaders(),
          credentials:"include"
        }
      );


    let data = {};

    try{

      data =
        await response.json();

    }catch(error){

      data = {};

    }


    if(
      response.status === 401 ||
      response.status === 403
    ){

      container.innerHTML = `
        <div class="error">
          Session expired. Please login again.
        </div>
      `;

      totalAmount.textContent =
        "PKR 0.00";

      totalCount.textContent =
        "0 withdrawals";

      return;

    }


    if(!response.ok){

      throw new Error(
        data.message ||
        "Failed to load withdrawal history."
      );

    }


    if(data.sessionToken){

      sessionStorage.setItem(
        "userSessionToken",
        data.sessionToken
      );

      sessionStorage.setItem(
        "sessionToken",
        data.sessionToken
      );

    }


    if(data.csrfToken){

      sessionStorage.setItem(
        "userCsrfToken",
        data.csrfToken
      );

      sessionStorage.setItem(
        "csrfToken",
        data.csrfToken
      );

    }


    let requests = [];


    if(Array.isArray(data)){

      requests =
        data;

    }else if(
      Array.isArray(
        data.withdrawals
      )
    ){

      requests =
        data.withdrawals;

    }else if(
      Array.isArray(
        data.data
      )
    ){

      requests =
        data.data;

    }


    requests =
      requests.filter(
        function(request){

          return String(
            request.username ||
            ""
          ).trim().toLowerCase()
          ===
          username.trim().toLowerCase();

        }
      );


    requests.sort(
      function(a,b){

        const dateA =
          new Date(
            a.createdAt ||
            a.created_at ||
            0
          ).getTime();

        const dateB =
          new Date(
            b.createdAt ||
            b.created_at ||
            0
          ).getTime();

        return dateB - dateA;

      }
    );


    let total = 0;


    requests.forEach(
      function(request){

        total +=
          Number(
            request.amount
          ) || 0;

      }
    );


    totalAmount.textContent =
      "PKR " +
      total.toLocaleString(
        "en-PK",
        {
          minimumFractionDigits:2,
          maximumFractionDigits:2
        }
      );


    totalCount.textContent =
      requests.length +
      (
        requests.length === 1
          ? " withdrawal"
          : " withdrawals"
      );


    if(requests.length === 0){

      container.innerHTML = `
        <div class="empty">

          <div class="empty-icon">
            💸
          </div>

          <h3>No Withdrawal History</h3>

          <p>
            Your withdrawal requests will appear here.
          </p>

        </div>
      `;

      return;

    }


    container.innerHTML =
      requests.map(
        function(request){

          const amount =
            Number(
              request.amount
            ) || 0;


          const status =
            getStatusText(
              request.status
            );


          const statusClass =
            getStatusClass(
              request.status
            );


          const method =
            request.method ||
            "—";


          const accountName =
            request.accountName ||
            request.account_name ||
            "—";


          const accountNumber =
            request.accountNumber ||
            request.account_number ||
            "—";


          const createdDate =
            formatDate(
              request.createdAt ||
              request.created_at
            );


          const approvedDate =
            formatDate(
              request.approvedAt ||
              request.approved_at
            );


          const requestId =
            request.id ||
            "—";


          const refunded =
            Boolean(
              request.refundedAt ||
              request.refunded_at
            );


          const refundHTML =
            refunded
              ? `
                <div class="refund">
                  ✓ Amount refunded to your balance
                </div>
              `
              : "";


          return `

            <div class="record">

              <div class="record-top">

                <div class="amount">

                  PKR
                  ${amount.toLocaleString(
                    "en-PK",
                    {
                      minimumFractionDigits:2,
                      maximumFractionDigits:2
                    }
                  )}

                </div>

                <div
                  class="status ${statusClass}"
                >
                  ${escapeHTML(status)}
                </div>

              </div>


              <div class="details">

                <div class="row">

                  <span class="label">
                    Payment Method
                  </span>

                  <span class="value">
                    ${escapeHTML(method)}
                  </span>

                </div>


                <div class="row">

                  <span class="label">
                    Account Name
                  </span>

                  <span class="value">
                    ${escapeHTML(accountName)}
                  </span>

                </div>


                <div class="row">

                  <span class="label">
                    Account Number
                  </span>

                  <span class="value">
                    ${escapeHTML(accountNumber)}
                  </span>

                </div>


                <div class="row">

                  <span class="label">
                    Request Date
                  </span>

                  <span class="value">
                    ${escapeHTML(createdDate)}
                  </span>

                </div>


                <div class="row">

                  <span class="label">
                    Approved Date
                  </span>

                  <span class="value">
                    ${escapeHTML(approvedDate)}
                  </span>

                </div>

              </div>


              <div class="request-id">

                Request ID:
                ${escapeHTML(requestId)}

              </div>


              ${refundHTML}

            </div>

          `;

        }
      ).join("");


  }catch(error){

    container.innerHTML = `
      <div class="error">
        ${escapeHTML(
          error.message ||
          "Unable to load withdrawal history."
        )}
      </div>
    `;

    totalAmount.textContent =
      "PKR 0.00";

    totalCount.textContent =
      "0 withdrawals";

  }

}


document.addEventListener(
  "DOMContentLoaded",
  function(){

    loadHistory();

  }
);

</script></body>
</html>
