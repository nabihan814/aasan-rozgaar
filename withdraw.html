<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Withdraw - Aasan Rozgaar</title>

<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:Arial,sans-serif}
body{background:#f4f7f5;color:#222}
.header{position:relative;background:#0b8f55;color:white;padding:18px 16px;text-align:center;font-size:22px;font-weight:bold}
.back-btn{position:absolute;left:14px;top:13px;background:rgba(255,255,255,.15);color:white;border:1px solid rgba(255,255,255,.4);border-radius:8px;padding:8px 12px;font-size:14px;font-weight:bold;cursor:pointer}
.container{max-width:520px;margin:auto;padding:18px 14px 30px}
.balance-box{background:linear-gradient(135deg,#087f4d,#0ca866);color:white;border-radius:16px;padding:22px 18px;margin-bottom:18px;box-shadow:0 5px 18px rgba(0,0,0,.12)}
.balance-label{font-size:14px;opacity:.9;margin-bottom:8px}
.balance{font-size:30px;font-weight:bold}
.currency{font-size:15px;margin-left:4px}
.card{background:white;border-radius:16px;padding:20px 16px;box-shadow:0 3px 14px rgba(0,0,0,.08)}
.card-title{font-size:20px;font-weight:bold;margin-bottom:18px;color:#087f4d}
label{display:block;font-size:14px;font-weight:bold;margin:14px 0 7px}
select,input{width:100%;height:48px;border:1px solid #d8d8d8;border-radius:10px;padding:0 13px;font-size:15px;outline:none;background:white}
select:focus,input:focus{border-color:#0b995b}
input:disabled,select:disabled{background:#f0f0f0;color:#555}
.withdraw-btn{width:100%;border:0;background:#0b8f55;color:white;height:50px;border-radius:11px;margin-top:20px;font-size:16px;font-weight:bold;cursor:pointer}
.withdraw-btn:disabled{background:#9aa5a0;cursor:not-allowed}
.cooldown-box{background:#fff7e6;color:#8a5a00;border:1px solid #f0d49a;border-radius:10px;padding:12px;margin-top:15px;text-align:center;font-size:14px;display:none}
.message{margin-top:15px;padding:13px;border-radius:10px;display:none;font-size:14px;line-height:1.5;font-weight:600}
.message.success{background:#e8f8ef;color:#087f4d;border:1px solid #b9e8ce}
.message.error{background:#ffeaea;color:#b42318;border:1px solid #f1b7b7}
.note{margin-top:15px;background:#f1f8f4;border-radius:10px;padding:12px;font-size:13px;line-height:1.5;color:#555}
.popup-overlay{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:9999;padding:20px}
.popup-overlay.show{display:flex}
.popup{width:100%;max-width:380px;background:white;border-radius:16px;padding:22px 18px;text-align:center;box-shadow:0 10px 35px rgba(0,0,0,.25)}
.popup-icon{width:55px;height:55px;margin:0 auto 12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:27px;font-weight:bold}
.popup.success .popup-icon{background:#e8f8ef;color:#087f4d}
.popup.error .popup-icon{background:#ffeaea;color:#b42318}
.popup h3{margin-bottom:8px;font-size:20px}
.popup p{color:#666;font-size:14px;line-height:1.5;margin-bottom:18px}
.popup-btn{width:100%;height:45px;border:0;border-radius:9px;background:#0b8f55;color:white;font-weight:bold;cursor:pointer;font-size:15px}
.popup.error .popup-btn{background:#b42318}
.test-mode{margin-top:10px;text-align:center;font-size:11px;color:#999}
</style>
</head>

<body>

<div class="header">
  <button type="button" class="back-btn" onclick="goBack()">← Back</button>
  <div>Withdraw Funds</div>
</div>

<div class="container">
  <div class="balance-box">
    <div class="balance-label">Your Current Balance</div>
    <div class="balance">
      <span id="balanceAmount">0.00</span>
      <span class="currency">PKR</span>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Withdraw Details</div>

    <label for="withdrawMethod">Payment Method</label>
    <select id="withdrawMethod">
      <option value="">Select Method</option>
      <option value="JazzCash">JazzCash</option>
      <option value="EasyPaisa">EasyPaisa</option>
    </select>

    <label for="accountName">Account Holder Name</label>
    <input type="text" id="accountName" placeholder="Enter account holder name" autocomplete="name">

    <label for="accountNumber">Account / Mobile Number</label>
    <input type="tel" id="accountNumber" placeholder="03XXXXXXXXX" inputmode="numeric">

    <label for="withdrawAmount">Withdraw Amount</label>
    <input type="number" id="withdrawAmount" placeholder="Minimum 500 PKR" min="500" max="50000" step="0.01">

    <button type="button" class="withdraw-btn" id="withdrawBtn" onclick="submitWithdraw()">WITHDRAW</button>

    <div id="cooldownBox" class="cooldown-box"></div>
    <div id="message" class="message"></div>

    <div class="note">
      Minimum withdrawal: <b>500 PKR</b><br>
      Maximum withdrawal: <b>50,000 PKR</b><br>
      Withdrawal requests are sent to Admin for processing.
    </div>

    <div class="test-mode" id="testModeText"></div>
  </div>
</div>

<div class="popup-overlay" id="popupOverlay">
  <div class="popup" id="popupBox">
    <div class="popup-icon" id="popupIcon">✓</div>
    <h3 id="popupTitle">Success</h3>
    <p id="popupText">Done</p>
    <button type="button" class="popup-btn" onclick="closePopup()">OK</button>
  </div>
</div>

<script>
"use strict";

const API_BASE = "https://aasan-rozgaar-backend.onrender.com";

/*
  TEST_MODE sirf frontend timer ko control karta hai.
  Backend cooldown alag setting se control hota hai.
*/
const TEST_MODE = true;
const DAY = 24 * 60 * 60 * 1000;
const COOLDOWN = TEST_MODE ? 60 * 1000 : DAY;

let serverBalance = 0;
let isSubmitting = false;

function getCurrentUser(){
  return (localStorage.getItem("currentUser") || "").trim();
}

function getSessionToken(){
  return (
    sessionStorage.getItem("userSessionToken") ||
    sessionStorage.getItem("sessionToken") ||
    ""
  ).trim();
}

function getCsrfToken(){
  return (
    sessionStorage.getItem("userCsrfToken") ||
    sessionStorage.getItem("csrfToken") ||
    ""
  ).trim();
}

function authHeaders(includeCsrf = false){
  const headers = { "Accept": "application/json" };
  const token = getSessionToken();
  const csrfToken = getCsrfToken();

  if(token){
    headers["Authorization"] = "Bearer " + token;
  }

  if(includeCsrf && csrfToken){
    headers["X-CSRF-Token"] = csrfToken;
  }

  return headers;
}

function pendingKey(username){
  return "pending_withdraw_request_" + username;
}

function getPendingWithdraw(username){
  try{
    const saved = localStorage.getItem(pendingKey(username));
    return saved ? JSON.parse(saved) : null;
  }catch(error){
    return null;
  }
}

function savePendingWithdraw(username, request){
  localStorage.setItem(pendingKey(username), JSON.stringify(request));
}

function clearPendingWithdraw(username){
  localStorage.removeItem(pendingKey(username));
}

function makeIdempotencyKey(){
  if(window.crypto && typeof window.crypto.randomUUID === "function"){
    return window.crypto.randomUUID();
  }

  /*
    UUID-format fallback for browsers without randomUUID().
  */
  return "xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx".replace(/[xy]/g, function(c){
    const r = Math.random() * 16 | 0;
    const v = c === "x" ? r : (r & 0x3 | 0x8);
    return v.toString(16);
  });
}

async function loadBalance(){
  const username = getCurrentUser();

  if(!username){
    serverBalance = 0;
    updateBalanceDisplay();
    return;
  }

  try{
    const response = await fetch(
      API_BASE + "/api/balance/" + encodeURIComponent(username),
      {
        method: "GET",
        headers: authHeaders(),
        credentials: "include"
      }
    );

    const data = await response.json();

    if(!response.ok){
      throw new Error(data.message || "Unable to load balance");
    }

    const balance = Number(data.balance ?? 0);
    serverBalance = Number.isFinite(balance) && balance >= 0 ? balance : 0;
    updateBalanceDisplay();
  }catch(error){
    updateBalanceDisplay();
  }
}

function updateBalanceDisplay(){
  document.getElementById("balanceAmount").textContent =
    serverBalance.toLocaleString("en-PK", {
      minimumFractionDigits: 2,
      maximumFractionDigits: 2
    });
}

function showPopup(title, text, type){
  document.getElementById("popupTitle").textContent = title;
  document.getElementById("popupText").textContent = text;

  const box = document.getElementById("popupBox");
  box.className = "popup " + type;

  document.getElementById("popupIcon").textContent =
    type === "success" ? "✓" : "!";

  document.getElementById("popupOverlay").classList.add("show");
}

function closePopup(){
  document.getElementById("popupOverlay").classList.remove("show");
}

document.addEventListener("click", function(event){
  const overlay = document.getElementById("popupOverlay");
  if(event.target === overlay){
    closePopup();
  }
});

function showMessage(text, type){
  const box = document.getElementById("message");
  box.textContent = text;
  box.className = "message " + type;
  box.style.display = "block";
}

function loadSavedAccount(){
  const username = getCurrentUser();
  if(!username) return;

  document.getElementById("accountName").value =
    localStorage.getItem("withdraw_account_name_" + username) || "";

  document.getElementById("accountNumber").value =
    localStorage.getItem("withdraw_account_number_" + username) || "";

  document.getElementById("withdrawMethod").value =
    localStorage.getItem("withdraw_method_" + username) || "";
}

function getLastWithdrawTime(username){
  return parseInt(
    localStorage.getItem("last_withdraw_time_" + username),
    10
  ) || 0;
}

function setFormLocked(locked){
  document.getElementById("withdrawMethod").disabled = locked;
  document.getElementById("accountName").disabled = locked;
  document.getElementById("accountNumber").disabled = locked;
  document.getElementById("withdrawAmount").disabled = locked;

  document.getElementById("withdrawBtn").textContent =
    locked ? "RETRY PENDING REQUEST" : "WITHDRAW";
}

function restorePendingWithdraw(){
  const username = getCurrentUser();
  if(!username) return;

  const pending = getPendingWithdraw(username);
  if(!pending || !pending.idempotencyKey || !pending.payload) return;

  /*
    Agar pichli request ka result uncertain tha, usi details
    aur usi key ke saath retry hoga.
  */
  document.getElementById("withdrawMethod").value = pending.payload.method;
  document.getElementById("accountName").value = pending.payload.accountName;
  document.getElementById("accountNumber").value = pending.payload.accountNumber;
  document.getElementById("withdrawAmount").value = pending.payload.amount;

  setFormLocked(true);

  showMessage(
    "A previous request is awaiting confirmation. Retry it to safely check its result. Do not change these details.",
    "error"
  );
}

function updateCooldown(){
  const username = getCurrentUser();
  if(!username) return;

  const button = document.getElementById("withdrawBtn");
  const box = document.getElementById("cooldownBox");
  const pending = getPendingWithdraw(username);

  if(isSubmitting){
    button.disabled = true;
    return;
  }

  /*
    Pending requests must remain retryable even if the page
    was reopened. Do not apply the local timer to them.
  */
  if(pending && pending.idempotencyKey){
    button.disabled = false;
    box.style.display = "none";
    return;
  }

  const remaining = getLastWithdrawTime(username) + COOLDOWN - Date.now();

  if(remaining > 0){
    button.disabled = true;
    box.style.display = "block";

    const totalSeconds = Math.ceil(remaining / 1000);
    const hours = Math.floor(totalSeconds / 3600);
    const minutes = Math.floor((totalSeconds % 3600) / 60);
    const seconds = totalSeconds % 60;

    const timeText = TEST_MODE
      ? String(minutes).padStart(2, "0") + ":" + String(seconds).padStart(2, "0")
      : String(hours).padStart(2, "0") + ":" +
        String(minutes).padStart(2, "0") + ":" +
        String(seconds).padStart(2, "0");

    box.innerHTML = "Next withdrawal available in <b>" + timeText + "</b>";
  }else{
    button.disabled = false;
    box.style.display = "none";
  }
}

function validateForm(){
  const method = document.getElementById("withdrawMethod").value.trim();
  const accountName = document.getElementById("accountName").value.trim();
  const accountNumber = document.getElementById("accountNumber").value.trim();
  const amount = Number(document.getElementById("withdrawAmount").value);

  if(!method){
    showPopup("Payment Method", "Please select JazzCash or EasyPaisa.", "error");
    return null;
  }

  if(method !== "JazzCash" && method !== "EasyPaisa"){
    showPopup("Payment Method", "Please select a valid payment method.", "error");
    return null;
  }

  if(!accountName){
    showPopup("Account Name", "Please enter account holder name.", "error");
    return null;
  }

  if(!accountNumber){
    showPopup("Account Number", "Please enter account/mobile number.", "error");
    return null;
  }

  if(!Number.isFinite(amount)){
    showPopup("Amount Required", "Please enter withdrawal amount.", "error");
    return null;
  }

  if(amount < 500){
    showPopup("Minimum Amount", "Minimum withdrawal amount is 500 PKR.", "error");
    return null;
  }

  if(amount > 50000){
    showPopup("Maximum Amount", "Maximum withdrawal amount is 50,000 PKR.", "error");
    return null;
  }

  if(!/^\d{10,15}$/.test(accountNumber.replace(/[\s+-]/g, ""))){
    showPopup("Account Number", "Please check your account/mobile number.", "error");
    return null;
  }

  if(amount > serverBalance){
    showPopup(
      "Insufficient Balance",
      "Your current balance is " + serverBalance.toLocaleString("en-PK", {
        minimumFractionDigits: 2,
        maximumFractionDigits: 2
      }) + " PKR.",
      "error"
    );
    return null;
  }

  return {
    amount: amount,
    method: method,
    accountName: accountName,
    accountNumber: accountNumber
  };
}

async function submitWithdraw(){
  if(isSubmitting) return;

  const username = getCurrentUser();

  if(!username){
    showPopup("Login Required", "Please login first before making a withdrawal request.", "error");
    return;
  }

  const token = getSessionToken();
  const csrfToken = getCsrfToken();

  if(!token || !csrfToken){
    showPopup("Login Required", "Your login session has expired. Please login again.", "error");
    return;
  }

  let pending = getPendingWithdraw(username);
  let payload;
  let key;

  if(pending && pending.idempotencyKey && pending.payload){
    /*
      Always retry the exact original payload with its original key.
    */
    payload = pending.payload;
    key = pending.idempotencyKey;
  }else{
    const lastTime = getLastWithdrawTime(username);

    if(lastTime && Date.now() < lastTime + COOLDOWN){
      showPopup(
        "Withdrawal Locked",
        TEST_MODE
          ? "For testing, the next withdrawal is available after 1 minute."
          : "You can make another withdrawal after 24 hours.",
        "error"
      );
      updateCooldown();
      return;
    }

    payload = validateForm();
    if(!payload) return;

    key = makeIdempotencyKey();

    pending = {
      idempotencyKey: key,
      payload: payload,
      createdAt: Date.now()
    };

    /*
      Save before sending: a lost response must not create
      a new key when the user retries.
    */
    try{
      savePendingWithdraw(username, pending);
    }catch(error){
      showPopup(
        "Storage Error",
        "This request could not be saved safely on this device. Please check device storage and try again.",
        "error"
      );
      return;
    }
  }

  isSubmitting = true;
  setFormLocked(true);
  document.getElementById("withdrawBtn").disabled = true;
  document.getElementById("message").style.display = "none";

  try{
    const response = await fetch(API_BASE + "/api/withdrawals", {
      method: "POST",
      headers: {
        ...authHeaders(true),
        "Content-Type": "application/json"
      },
      credentials: "include",
      body: JSON.stringify({
        amount: payload.amount,
        method: payload.method,
        accountName: payload.accountName,
        accountNumber: payload.accountNumber,
        idempotencyKey: key
      })
    });

    let data = {};
    try{
      data = await response.json();
    }catch(error){
      data = {};
    }

    if(data.csrfToken){
      sessionStorage.setItem("userCsrfToken", data.csrfToken);
      sessionStorage.setItem("csrfToken", data.csrfToken);
    }

    if(data.sessionToken){
      sessionStorage.setItem("userSessionToken", data.sessionToken);
      sessionStorage.setItem("sessionToken", data.sessionToken);
    }

    if(!response.ok){
      /*
        A normal 4xx response means the server returned a rejection.
        For 5xx, keep the key because the final database outcome
        may be uncertain.
      */
      if(response.status < 500){
        clearPendingWithdraw(username);
        setFormLocked(false);
      }

      throw new Error(
        data.message ||
        (response.status >= 500
          ? "Server error. Your request is saved for a safe retry."
          : "Withdrawal request was rejected.")
      );
    }

    /*
      Only clear the saved key after the server confirms success.
    */
    clearPendingWithdraw(username);

    if(data.remainingBalance !== undefined){
      const newBalance = Number(data.remainingBalance);
      if(Number.isFinite(newBalance) && newBalance >= 0){
        serverBalance = newBalance;
      }else{
        await loadBalance();
      }
    }else{
      await loadBalance();
    }

    localStorage.setItem("withdraw_account_name_" + username, payload.accountName);
    localStorage.setItem("withdraw_account_number_" + username, payload.accountNumber);
    localStorage.setItem("withdraw_method_" + username, payload.method);
    localStorage.setItem("last_withdraw_time_" + username, String(Date.now()));

    document.getElementById("withdrawAmount").value = "";

    setFormLocked(false);
    showMessage(
      data.duplicate
        ? "This withdrawal request was already received by the server. No new request was created."
        : "Your withdrawal request has been submitted to Admin.",
      "success"
    );

    showPopup(
      data.duplicate ? "Request Confirmed" : "Withdrawal Submitted",
      data.duplicate
        ? "Your previous request was already received. It was not submitted a second time."
        : "Your withdrawal request was submitted successfully and sent to Admin for processing.",
      "success"
    );

  }catch(error){
    /*
      Network errors and server errors keep the pending key and payload.
      The user can press Retry Pending Request to send the same request.
    */
    const stillPending = getPendingWithdraw(username);

    if(stillPending && stillPending.idempotencyKey){
      setFormLocked(true);
      showMessage(
        "The result could not be confirmed. Your request details are saved. Tap RETRY PENDING REQUEST to retry safely.",
        "error"
      );
    }else{
      setFormLocked(false);
    }

    showPopup(
      "Withdrawal Not Confirmed",
      error.message || "The request result could not be confirmed. Please try again.",
      "error"
    );

    await loadBalance();

  }finally{
    isSubmitting = false;
    updateCooldown();
  }
}

function goBack(){
  if(document.referrer && document.referrer !== window.location.href){
    history.back();
  }else{
    window.location.href = "./home.html";
  }
}

function updateTestModeText(){
  document.getElementById("testModeText").textContent =
    TEST_MODE
      ? "TEST MODE: Frontend cooldown = 1 minute; backend rules still apply."
      : "Frontend cooldown = 24 hours; backend rules still apply.";
}

document.addEventListener("DOMContentLoaded", async function(){
  updateBalanceDisplay();
  loadSavedAccount();
  restorePendingWithdraw();
  updateCooldown();
  updateTestModeText();
  await loadBalance();
});

setInterval(function(){
  updateCooldown();
}, 1000);

setInterval(function(){
  loadBalance();
}, 10000);
</script>

</body>
</html>
