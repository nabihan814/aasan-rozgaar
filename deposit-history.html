<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Aasan Rozgaar - Deposit History</title>

<style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f7f6;
    color:#333;
    padding:20px;
}

.container{
    max-width:480px;
    margin:0 auto;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

h2{
    text-align:center;
    color:#1b5e20;
    font-size:22px;
    margin-bottom:6px;
}

.account-name{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:20px;
}

.history-card{
    padding:15px;
    margin-bottom:13px;
    border-radius:10px;
    background:#fafafa;
    border-left:5px solid #9e9e9e;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.history-card.Pending{
    background:#fff9e6;
    border-left-color:#ff9800;
}

.history-card.Inprocess{
    background:#e3f2fd;
    border-left-color:#1976d2;
}

.history-card.Approved{
    background:#e8f5e9;
    border-left-color:#2e7d32;
}

.history-card.Rejected{
    background:#ffebee;
    border-left-color:#d32f2f;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:8px;
    font-size:14px;
}

.row span:first-child{
    color:#555;
    min-width:110px;
}

.row span:last-child{
    text-align:right;
    word-break:break-word;
}

.amount{
    font-weight:700;
    color:#1b5e20;
}

.status{
    font-weight:800;
    text-transform:uppercase;
    font-size:12px;
}

.status.Pending{
    color:#f57c00;
}

.status.Inprocess{
    color:#1976d2;
}

.status.Approved{
    color:#2e7d32;
}

.status.Rejected{
    color:#c62828;
}

.date-row{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid rgba(0,0,0,.12);
    font-size:11px;
    color:#777;
}

.deposit-id{
    font-size:11px;
    color:#888;
    margin-top:8px;
}

.empty-msg{
    text-align:center;
    color:#777;
    padding:35px 10px;
    font-size:15px;
}

.login-msg{
    text-align:center;
    color:#c62828;
    padding:35px 10px;
    font-size:15px;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.back-link:hover{
    text-decoration:underline;
}

.refresh-note{
    text-align:center;
    font-size:11px;
    color:#999;
    margin-top:12px;
}

</style>
</head>

<body>

<div class="container">

    <h2>Deposit History & Logs</h2>

    <div id="accountName" class="account-name"></div>

    <div id="depositHistoryContainer"></div>

    <div class="refresh-note">
        Deposit status automatically updates when changed.
    </div>

    <a href="home.html" class="back-link">
        &larr; Back to Dashboard
    </a>

</div>


<script>

/* =========================================================
   AASAN ROZGAAR
   USER DEPOSIT HISTORY
   Connected with: depositRequests
   ========================================================= */


/* ---------- HTML SECURITY ---------- */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ---------- READ DEPOSITS ---------- */

function getDepositRequests(){

    try{

        const data =
            localStorage.getItem("depositRequests");

        if(!data){
            return [];
        }

        const parsed = JSON.parse(data);

        return Array.isArray(parsed)
            ? parsed
            : [];

    }catch(error){

        console.error(
            "Deposit data error:",
            error
        );

        return [];

    }

}


/* ---------- LOAD USER HISTORY ---------- */

function loadDepositHistory(){

    const container =
        document.getElementById(
            "depositHistoryContainer"
        );

    const accountName =
        document.getElementById(
            "accountName"
        );


    /* Current logged-in user */

    const currentUser =
        localStorage.getItem("currentUser");


    if(!currentUser){

        accountName.textContent = "";

        container.innerHTML = `
            <div class="login-msg">
                Please login first to view
                your deposit history.
            </div>
        `;

        return;

    }


    accountName.textContent =
        "Account: " + currentUser;


    /* Get all deposits */

    const allRequests =
        getDepositRequests();


    /*
       Only current user's deposits.
    */

    const userRequests =
        allRequests.filter(function(req){

            return String(
                req.username || ""
            ).toLowerCase()
            ===
            String(
                currentUser
            ).toLowerCase();

        });


    /* No history */

    if(userRequests.length === 0){

        container.innerHTML = `
            <div class="empty-msg">
                Abhi tak koi deposit request
                nahi lagai gayi.
            </div>
        `;

        return;

    }


    /*
       Newest deposits first.
       Date string se sorting fail ho sakti hai,
       isliye array order + timestamp/id
       ko safely handle kar rahe hain.
    */

    userRequests.sort(function(a,b){

        const aTime =
            Number(a.createdAt)
            || Number(a.timestamp)
            || Number(a.id?.replace(/\D/g,""))
            || 0;

        const bTime =
            Number(b.createdAt)
            || Number(b.timestamp)
            || Number(b.id?.replace(/\D/g,""))
            || 0;

        return bTime - aTime;

    });


    container.innerHTML = "";


    /* ---------- CREATE EACH DEPOSIT CARD ---------- */

    userRequests.forEach(function(req){

        const status =
            req.status || "Pending";


        const safeStatus =
            [
                "Pending",
                "Inprocess",
                "Approved",
                "Rejected"
            ].includes(status)
            ? status
            : "Pending";


        const amount =
            Number(req.amount) || 0;


        const method =
            req.method || "-";


        const trxid =
            req.trxid
            || req.tid
            || "-";


        const details =
            req.details
            || "-";


        const date =
            req.date
            || "-";


        const card =
            document.createElement("div");


        card.className =
            "history-card " + safeStatus;


        card.innerHTML = `

            <div class="row">

                <span>
                    <strong>Method:</strong>
                </span>

                <span>
                    ${escapeHTML(method)}
                </span>

            </div>


            <div class="row">

                <span>
                    <strong>Amount:</strong>
                </span>

                <span class="amount">
                    Rs ${amount.toLocaleString()}
                </span>

            </div>


            <div class="row">

                <span>
                    <strong>TRX ID:</strong>
                </span>

                <span>
                    ${escapeHTML(trxid)}
                </span>

            </div>


            <div class="row">

                <span>
                    <strong>Status:</strong>
                </span>

                <span class="status ${safeStatus}">
                    ${escapeHTML(safeStatus)}
                </span>

            </div>


            <div class="row">

                <span>
                    <strong>Payment Details:</strong>
                </span>

                <span>
                    ${escapeHTML(details)}
                </span>

            </div>


            <div class="row date-row">

                <span>
                    Date & Time:
                </span>

                <span>
                    ${escapeHTML(date)}
                </span>

            </div>


            <div class="deposit-id">

                Deposit ID:
                ${escapeHTML(req.id || "-")}

            </div>

        `;


        container.appendChild(card);

    });

}


/* ---------- PAGE LOAD ---------- */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadDepositHistory();

    }
);


/* =========================================================
   LIVE UPDATE
   =========================================================

   Admin agar deposit ka status change kare:

   Pending
       ↓
   Inprocess
       ↓
   Approved

   ya

   Pending
       ↓
   Rejected

   to depositRequests change hote hi
   history dobara load hogi.
   ========================================================= */

window.addEventListener(
    "storage",
    function(event){

        if(
            event.key === "depositRequests"
        ){

            loadDepositHistory();

        }

    }
);


/*
   Same page/browser mein agar kisi script
   ne depositRequests update kiya ho,
   to thori der baad check karte rahenge.
*/

let lastDepositData =
    localStorage.getItem("depositRequests")
    || "";


setInterval(function(){

    const currentData =
        localStorage.getItem("depositRequests")
        || "";


    if(currentData !== lastDepositData){

        lastDepositData =
            currentData;

        loadDepositHistory();

    }

},1000);


</script>

</body>
</html>
