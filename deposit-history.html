<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Deposit History - Aasan Rozgaar</title><style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
}

body{
    font-family:Arial,sans-serif;
    background:#f4f7f5;
    color:#222;
}

.header{
    background:linear-gradient(135deg,#087f5b,#12a878);
    color:white;
    padding:20px;
    text-align:center;
}

.header h1{
    font-size:24px;
    margin-bottom:5px;
}

.header p{
    font-size:14px;
    opacity:.9;
}

.container{
    max-width:700px;
    margin:20px auto;
    padding:0 15px;
}

.user-box{
    background:white;
    border-radius:12px;
    padding:15px;
    margin-bottom:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.08);
}

.user-box strong{
    color:#087f5b;
}

.loading{
    text-align:center;
    padding:30px;
    color:#666;
}

.error{
    background:#ffe5e5;
    color:#b00020;
    padding:15px;
    border-radius:10px;
    text-align:center;
}

.empty{
    background:white;
    padding:30px 20px;
    border-radius:12px;
    text-align:center;
    color:#777;
    box-shadow:0 2px 8px rgba(0,0,0,.06);
}

.history-card{
    background:white;
    border-radius:12px;
    padding:16px;
    margin-bottom:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.07);
}

.row{
    display:flex;
    justify-content:space-between;
    gap:10px;
    padding:7px 0;
    border-bottom:1px solid #eee;
}

.row:last-child{
    border-bottom:none;
}

.label{
    color:#777;
    font-size:14px;
}

.value{
    font-weight:bold;
    text-align:right;
    word-break:break-word;
}

.status{
    display:inline-block;
    padding:5px 10px;
    border-radius:20px;
    font-size:12px;
    font-weight:bold;
}

.status-pending{
    background:#fff3cd;
    color:#856404;
}

.status-inprocess{
    background:#dbeafe;
    color:#1d4ed8;
}

.status-approved{
    background:#d1fae5;
    color:#047857;
}

.status-rejected{
    background:#fee2e2;
    color:#b91c1c;
}

.back-btn{
    display:block;
    width:100%;
    border:none;
    background:#087f5b;
    color:white;
    padding:13px;
    border-radius:10px;
    font-size:16px;
    font-weight:bold;
    margin-top:20px;
    cursor:pointer;
}

.back-btn:active{
    transform:scale(.98);
}
</style></head><body><div class="header">
    <h1>Deposit History</h1>
    <p>Your deposit records</p>
</div><div class="container"><div class="user-box">
    Username:
    <strong id="username">Loading...</strong>
</div>

<div id="historyContainer">
    <div class="loading">Loading deposit history...</div>
</div>

<button class="back-btn" onclick="goBack()">Back</button>

</div><script>
const API_URL = "https://aasan-rozgaar-backend.onrender.com";

function getCurrentUser(){
    return localStorage.getItem("currentUser") || "";
}

function getUserSessionToken(){
    return (
        sessionStorage.getItem("userSessionToken") ||
        sessionStorage.getItem("sessionToken") ||
        ""
    );
}

function getUserCsrfToken(){
    return (
        sessionStorage.getItem("userCsrfToken") ||
        sessionStorage.getItem("csrfToken") ||
        ""
    );
}

function authHeaders(){
    const token = getUserSessionToken();
    const csrfToken = getUserCsrfToken();

    const headers = {
        "Accept":"application/json"
    };

    if(token){
        headers["Authorization"] = "Bearer " + token;
    }

    if(csrfToken){
        headers["X-CSRF-Token"] = csrfToken;
    }

    return headers;
}

function normalizeStatus(status){
    const value = String(status || "")
        .trim()
        .toLowerCase();

    if(value === "pending"){
        return "Pending";
    }

    if(
        value === "inprocess" ||
        value === "in_process" ||
        value === "in-process" ||
        value === "in process"
    ){
        return "Inprocess";
    }

    if(
        value === "approved" ||
        value === "approve"
    ){
        return "Approved";
    }

    if(
        value === "rejected" ||
        value === "reject"
    ){
        return "Rejected";
    }

    return status || "Pending";
}

function getStatusClass(status){
    const normalized = normalizeStatus(status);

    if(normalized === "Approved"){
        return "status-approved";
    }

    if(normalized === "Rejected"){
        return "status-rejected";
    }

    if(normalized === "Inprocess"){
        return "status-inprocess";
    }

    return "status-pending";
}

function escapeHTML(value){
    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");
}

function formatAmount(amount){
    const number = Number(amount);

    if(!Number.isFinite(number)){
        return "Rs 0.00";
    }

    return "Rs " + number.toFixed(2);
}

function formatDate(dateValue){
    if(!dateValue){
        return "-";
    }

    const date = new Date(dateValue);

    if(Number.isNaN(date.getTime())){
        return escapeHTML(dateValue);
    }

    return date.toLocaleString();
}

async function loadDepositHistory(){

    const username = getCurrentUser();

    const usernameElement =
        document.getElementById("username");

    const container =
        document.getElementById("historyContainer");

    if(!username){
        usernameElement.textContent = "Not logged in";

        container.innerHTML =
            '<div class="error">Please login first.</div>';

        return;
    }

    usernameElement.textContent = username;

    container.innerHTML =
        '<div class="loading">Loading deposit history...</div>';

    try{

        const response = await fetch(
            API_URL +
            "/api/deposits/" +
            encodeURIComponent(username),
            {
                method:"GET",
                headers:authHeaders(),
                credentials:"include"
            }
        );

        let data = {};

        try{
            data = await response.json();
        }catch(error){
            data = {};
        }

        if(
            response.status === 401 ||
            response.status === 403
        ){
            container.innerHTML =
                '<div class="error">Session expired. Please login again.</div>';

            return;
        }

        if(!response.ok){
            throw new Error(
                data.message ||
                "Failed to load deposit history"
            );
        }

        if(data.sessionToken){
            sessionStorage.setItem(
                "userSessionToken",
                data.sessionToken
            );

            sessionStorage.setItem(
                "sessionToken",
                data.sessionToken
            );
        }

        if(data.csrfToken){
            sessionStorage.setItem(
                "userCsrfToken",
                data.csrfToken
            );

            sessionStorage.setItem(
                "csrfToken",
                data.csrfToken
            );
        }

        let deposits = [];

        if(Array.isArray(data)){
            deposits = data;
        }else if(Array.isArray(data.deposits)){
            deposits = data.deposits;
        }else if(Array.isArray(data.data)){
            deposits = data.data;
        }

        deposits.sort(function(a,b){

            const dateA =
                new Date(
                    a.createdAt ||
                    a.created_at ||
                    0
                ).getTime();

            const dateB =
                new Date(
                    b.createdAt ||
                    b.created_at ||
                    0
                ).getTime();

            return dateB - dateA;
        });

        if(deposits.length === 0){

            container.innerHTML =
                '<div class="empty">' +
                'No deposit history found.' +
                '</div>';

            return;
        }

        container.innerHTML =
            deposits.map(function(deposit){

                const status =
                    normalizeStatus(deposit.status);

                const amount =
                    deposit.amount;

                const method =
                    deposit.method || "-";

                const transactionId =
                    deposit.transactionId ||
                    deposit.transaction_id ||
                    "-";

                const createdAt =
                    deposit.createdAt ||
                    deposit.created_at;

                return `
                    <div class="history-card">

                        <div class="row">
                            <span class="label">Amount</span>
                            <span class="value">
                                ${formatAmount(amount)}
                            </span>
                        </div>

                        <div class="row">
                            <span class="label">Method</span>
                            <span class="value">
                                ${escapeHTML(method)}
                            </span>
                        </div>

                        <div class="row">
                            <span class="label">Transaction ID</span>
                            <span class="value">
                                ${escapeHTML(transactionId)}
                            </span>
                        </div>

                        <div class="row">
                            <span class="label">Status</span>
                            <span class="value">
                                <span class="status ${getStatusClass(status)}">
                                    ${escapeHTML(status)}
                                </span>
                            </span>
                        </div>

                        <div class="row">
                            <span class="label">Date</span>
                            <span class="value">
                                ${formatDate(createdAt)}
                            </span>
                        </div>

                    </div>
                `;

            }).join("");

    }catch(error){

        container.innerHTML =
            '<div class="error">' +
            escapeHTML(
                error.message ||
                "Unable to load deposit history."
            ) +
            '</div>';
    }
}

function goBack(){
    window.history.back();
}

window.addEventListener(
    "DOMContentLoaded",
    function(){
        loadDepositHistory();
    }
);
</script></body>
</html>
