<!DOCTYPE html><html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Aasan Rozgaar - Deposit History</title><style>

*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
}

body{
    background:#f4f7f6;
    color:#333;
    padding:20px;
}

.container{
    max-width:480px;
    margin:0 auto;
    background:#fff;
    padding:20px;
    border-radius:14px;
    box-shadow:0 4px 15px rgba(0,0,0,.06);
}

h2{
    text-align:center;
    color:#1b5e20;
    font-size:22px;
    margin-bottom:6px;
}

.account-name{
    text-align:center;
    color:#777;
    font-size:13px;
    margin-bottom:20px;
}

.history-card{
    padding:15px;
    margin-bottom:13px;
    border-radius:10px;
    background:#fafafa;
    border-left:5px solid #9e9e9e;
    box-shadow:0 2px 7px rgba(0,0,0,.04);
}

.history-card.Pending{
    background:#fff9e6;
    border-left-color:#ff9800;
}

.history-card.Inprocess{
    background:#e3f2fd;
    border-left-color:#1976d2;
}

.history-card.Approved{
    background:#e8f5e9;
    border-left-color:#2e7d32;
}

.history-card.Rejected{
    background:#ffebee;
    border-left-color:#d32f2f;
}

.row{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:12px;
    margin-bottom:8px;
    font-size:14px;
}

.row span:first-child{
    color:#555;
    min-width:110px;
}

.row span:last-child{
    text-align:right;
    word-break:break-word;
}

.amount{
    font-weight:700;
    color:#1b5e20;
}

.status{
    font-weight:800;
    text-transform:uppercase;
    font-size:12px;
}

.status.Pending{
    color:#f57c00;
}

.status.Inprocess{
    color:#1976d2;
}

.status.Approved{
    color:#2e7d32;
}

.status.Rejected{
    color:#c62828;
}

.date-row{
    margin-top:10px;
    padding-top:8px;
    border-top:1px solid rgba(0,0,0,.12);
    font-size:11px;
    color:#777;
}

.deposit-id{
    font-size:11px;
    color:#888;
    margin-top:8px;
}

.empty-msg{
    text-align:center;
    color:#777;
    padding:35px 10px;
    font-size:15px;
}

.login-msg{
    text-align:center;
    color:#c62828;
    padding:35px 10px;
    font-size:15px;
}

.error-msg{
    text-align:center;
    color:#c62828;
    padding:35px 10px;
    font-size:14px;
}

.loading-msg{
    text-align:center;
    color:#777;
    padding:35px 10px;
    font-size:15px;
}

.back-link{
    display:block;
    text-align:center;
    margin-top:20px;
    color:#555;
    text-decoration:none;
    font-size:14px;
    font-weight:600;
}

.back-link:hover{
    text-decoration:underline;
}

.refresh-note{
    text-align:center;
    font-size:11px;
    color:#999;
    margin-top:12px;
}

</style></head><body><div class="container"><h2>Deposit History & Logs</h2>

<div id="accountName" class="account-name"></div>

<div id="depositHistoryContainer"></div>

<div class="refresh-note">
    Deposit status automatically updates when changed.
</div>

<a href="home.html" class="back-link">
    &larr; Back to Dashboard
</a>

</div><script>

/* =========================================================
   AASAN ROZGAAR
   USER DEPOSIT HISTORY
   CONNECTED WITH BACKEND
   ========================================================= */


/* ---------- BACKEND ---------- */

const API_URL =
    "https://aasan-rozgaar-backend.onrender.com";


/* ---------- HTML SECURITY ---------- */

function escapeHTML(value){

    return String(value ?? "")
        .replace(/&/g,"&amp;")
        .replace(/</g,"&lt;")
        .replace(/>/g,"&gt;")
        .replace(/"/g,"&quot;")
        .replace(/'/g,"&#039;");

}


/* ---------- DISPLAY DATE ---------- */

function displayDateTime(value){

    if(!value){
        return "-";
    }

    const date =
        new Date(value);

    if(isNaN(date.getTime())){
        return String(value);
    }

    return date.toLocaleString(
        "en-PK",
        {
            day:"2-digit",
            month:"2-digit",
            year:"numeric",
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit",
            hour12:true
        }
    );

}


/* ---------- LOAD USER HISTORY ---------- */

async function loadDepositHistory(){

    const container =
        document.getElementById(
            "depositHistoryContainer"
        );

    const accountName =
        document.getElementById(
            "accountName"
        );


    /* Current logged-in user */

    const currentUser =
        localStorage.getItem(
            "currentUser"
        );


    if(!currentUser){

        accountName.textContent = "";

        container.innerHTML = `
            <div class="login-msg">
                Please login first to view
                your deposit history.
            </div>
        `;

        return;

    }


    accountName.textContent =
        "Account: " + currentUser;


    container.innerHTML = `
        <div class="loading-msg">
            Loading deposit history...
        </div>
    `;


    try{

        const response =
            await fetch(
                API_URL +
                "/api/deposits/" +
                encodeURIComponent(
                    currentUser
                ),
                {
                    method:"GET",
                    headers:{
                        "Accept":
                            "application/json"
                    },
                    cache:"no-store"
                }
            );


        const data =
            await response.json();


        if(!response.ok){

            throw new Error(
                data.message ||
                "Failed to load deposit history"
            );

        }


        const userRequests =
            Array.isArray(
                data.deposits
            )
            ? data.deposits
            : [];


        /* No history */

        if(userRequests.length === 0){

            container.innerHTML = `
                <div class="empty-msg">
                    Abhi tak koi deposit request
                    nahi lagai gayi.
                </div>
            `;

            return;

        }


        /* Newest first */

        userRequests.sort(
            function(a,b){

                return new Date(
                    b.createdAt || 0
                ).getTime()
                -
                new Date(
                    a.createdAt || 0
                ).getTime();

            }
        );


        container.innerHTML = "";


        /* ---------- CREATE EACH DEPOSIT CARD ---------- */

        userRequests.forEach(
            function(req){

                const rawStatus =
                    String(
                        req.status ||
                        "Pending"
                    );


                const safeStatus =
                    [
                        "Pending",
                        "Inprocess",
                        "Approved",
                        "Rejected"
                    ].includes(
                        rawStatus
                    )
                    ? rawStatus
                    : (
                        rawStatus === "Reject"
                        ? "Rejected"
                        : "Pending"
                    );


                const amount =
                    Number(
                        req.amount
                    ) || 0;


                const method =
                    req.method || "-";


                const trxid =
                    req.transactionId
                    || "-";


                const date =
                    displayDateTime(
                        req.createdAt
                    );


                const card =
                    document.createElement(
                        "div"
                    );


                card.className =
                    "history-card " +
                    safeStatus;


                card.innerHTML = `

                    <div class="row">

                        <span>
                            <strong>Method:</strong>
                        </span>

                        <span>
                            ${escapeHTML(
                                method
                            )}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            <strong>Amount:</strong>
                        </span>

                        <span class="amount">
                            Rs ${amount.toLocaleString(
                                "en-PK"
                            )}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            <strong>TRX ID:</strong>
                        </span>

                        <span>
                            ${escapeHTML(
                                trxid
                            )}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            <strong>Status:</strong>
                        </span>

                        <span class="status ${safeStatus}">
                            ${escapeHTML(
                                safeStatus
                            )}
                        </span>

                    </div>


                    <div class="row">

                        <span>
                            <strong>Payment Details:</strong>
                        </span>

                        <span>
                            ${escapeHTML(
                                method
                            )}
                        </span>

                    </div>


                    <div class="row date-row">

                        <span>
                            Date & Time:
                        </span>

                        <span>
                            ${escapeHTML(
                                date
                            )}
                        </span>

                    </div>


                    <div class="deposit-id">

                        Deposit ID:
                        ${escapeHTML(
                            req.id || "-"
                        )}

                    </div>

                `;


                container.appendChild(
                    card
                );

            }
        );


    }catch(error){

        console.error(
            "Deposit history error:",
            error
        );


        container.innerHTML = `
            <div class="error-msg">
                Deposit history load nahi ho rahi.
                <br>
                <small>
                    ${escapeHTML(
                        error.message ||
                        "Backend connection error"
                    )}
                </small>
            </div>
        `;

    }

}


/* ---------- PAGE LOAD ---------- */

window.addEventListener(
    "DOMContentLoaded",
    function(){

        loadDepositHistory();

    }
);


/* ---------- AUTO REFRESH ---------- */

setInterval(
    function(){

        loadDepositHistory();

    },
    5000
);

</script></body>
    </html>
